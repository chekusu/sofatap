plugins { id 'com.android.application' }
def selfUpdateEnabled = (providers.gradleProperty('sofatapDistribution').orElse('direct').get() == 'direct')

android {
    namespace 'com.chekusu.sofatap.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'com.chekusu.sofatap.tv'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.2.1-beta.1'
        buildConfigField 'boolean', 'SELF_UPDATE_ENABLED', selfUpdateEnabled.toString()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig true }
    sourceSets.main.manifest.srcFile layout.buildDirectory.file('generated/distribution/AndroidManifest.xml')
    packaging { resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/INDEX.LIST'] }
}

// Keep the sideload-install permission entirely out of Google Play artifacts.
tasks.register('generateDistributionManifest') {
    inputs.file('src/main/AndroidManifest.xml')
    inputs.property('selfUpdateEnabled', selfUpdateEnabled)
    outputs.file(layout.buildDirectory.file('generated/distribution/AndroidManifest.xml'))
    doLast {
        def manifest = file('src/main/AndroidManifest.xml').getText('UTF-8')
        if (selfUpdateEnabled) manifest = manifest.replace('</manifest>', '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>')
        def output = layout.buildDirectory.file('generated/distribution/AndroidManifest.xml').get().asFile
        output.parentFile.mkdirs()
        output.setText(manifest, 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn('generateDistributionManifest') }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.86'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
