name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-transport:
    name: macOS · protocol, TLS and iOS compile
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install integration-test dependency
        run: python3 -m pip install websockets==16.0
      - name: Host checks with fake input
        run: dotnet run --project tests/host/SofaTap.Host.Tests.csproj -c Release
      - name: Mac App Store host and wire checks with fake input
        run: >-
          dotnet run --project tests/host/SofaTap.Host.Tests.csproj -c Release
          --artifacts-path "$RUNNER_TEMP/sofatap-store-host-checks"
          -p:SofatapMacAppStore=true
      - name: Windows login broker state and credential lifetime checks
        run: dotnet run --project desktop/windows-login/Tests/Sofatap.Login.Tests.csproj -c Release
      - name: iPhone unlock identity and challenge checks
        shell: bash
        run: |
          xcrun swiftc -swift-version 5 ios/SofaTap/Core/SavedDevice.swift ios/SofaTap/Core/Pairing.swift \
            ios/SofaTap/Core/UnlockCredentialVault.swift ios/SofaTap/Core/UnlockProtocol.swift \
            ios/tests/UnlockProtocolTests.swift -o "$RUNNER_TEMP/sofatap-unlock-tests"
          "$RUNNER_TEMP/sofatap-unlock-tests"
      - name: Retired password flow cannot enroll or send requests
        shell: bash
        run: |
          xcrun swiftc -swift-version 5 ios/SofaTap/Core/SavedDevice.swift ios/SofaTap/Core/Pairing.swift \
            ios/SofaTap/Core/UnlockCredentialVault.swift ios/SofaTap/Core/UnlockProtocol.swift \
            ios/SofaTap/Core/ComputerUnlockController.swift ios/tests/UnlockRetirementTests.swift \
            -o "$RUNNER_TEMP/sofatap-unlock-retirement-tests"
          "$RUNNER_TEMP/sofatap-unlock-retirement-tests"
      - name: TLS and WebSocket integration in dry-run mode
        shell: bash
        run: SOFATAP_DOTNET="$(command -v dotnet)" python3 tests/smoke.py
      - name: Secure-desktop diagnostic policy checks without OS input
        run: |
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror desktop/windows-secure-input-probe/ProbeChecks.cpp -o "$RUNNER_TEMP/sofatap-secure-input-policy-tests"
          "$RUNNER_TEMP/sofatap-secure-input-policy-tests"
      - name: Mac virtual-display launch safety without opening windows
        run: |
          swiftc desktop/macos/ReceiverLaunchOptions.swift desktop/macos/tests/ReceiverLaunchOptionsTests.swift -o "$RUNNER_TEMP/sofatap-launch-tests"
          "$RUNNER_TEMP/sofatap-launch-tests"
      - name: Mac login startup policy without changing login items
        run: |
          swiftc -parse-as-library -swift-version 5 desktop/macos/ReceiverLoginItem.swift desktop/macos/tests/ReceiverLoginItemTests.swift -o "$RUNNER_TEMP/sofatap-login-tests"
          "$RUNNER_TEMP/sofatap-login-tests"
      - name: Mac App Store startup consent and container boundaries
        run: |
          swiftc -parse-as-library -swift-version 5 -D SOFATAP_MAC_APP_STORE desktop/macos/ReceiverLoginItem.swift desktop/macos/tests/ReceiverLoginItemTests.swift -o "$RUNNER_TEMP/sofatap-store-login-tests"
          "$RUNNER_TEMP/sofatap-store-login-tests"
          swiftc -parse-as-library -swift-version 5 desktop/macos/ReceiverStoreEnvironment.swift desktop/macos/tests/ReceiverStoreEnvironmentTests.swift -o "$RUNNER_TEMP/sofatap-store-container-tests"
          "$RUNNER_TEMP/sofatap-store-container-tests"
      - name: Native pairing parser checks
        shell: bash
        run: |
          swiftc ios/SofaTap/Core/SavedDevice.swift ios/SofaTap/Core/Pairing.swift tests/PairingTests.swift -o "$RUNNER_TEMP/sofatap-pairing-tests"
          "$RUNNER_TEMP/sofatap-pairing-tests"
      - name: Saved device migration and target selection without Keychain access
        run: bash ios/scripts/test-saved-devices.sh
      - name: Unified QR routing and metadata without device access
        run: bash ios/scripts/test-pairing-code.sh
      - name: Pairing cancellation, retry and duplicate bootstrap checks
        run: bash ios/scripts/test-pairing-attempt.sh
      - name: Native interface and permission localization coverage
        run: python3 ios/scripts/check-localizations.py
      - name: Receiver platform and permission-state checks
        shell: bash
        run: |
          swiftc ios/SofaTap/Core/ReceiverState.swift tests/ReceiverStateTests.swift -o "$RUNNER_TEMP/sofatap-receiver-tests"
          "$RUNNER_TEMP/sofatap-receiver-tests"
      - name: Single-screen touch gestures without desktop input
        shell: bash
        run: |
          swiftc ios/SofaTap/Core/GestureConfiguration.swift ios/SofaTap/Core/TouchGestureState.swift tests/TouchGestureTests.swift -o "$RUNNER_TEMP/sofatap-touch-tests"
          "$RUNNER_TEMP/sofatap-touch-tests"
      - name: Custom gesture profiles and persistence without device input
        run: bash ios/scripts/test-custom-gestures.sh
      - name: Edge scroll gestures and native view without desktop input
        run: bash ios/scripts/test-edge-scroll.sh
      - name: TV protocol boundaries without devices
        run: |
          swiftc ios/SofaTap/Core/TV/WebOSTVProtocol.swift tests/WebOSTVProtocolTests.swift -o "$RUNNER_TEMP/sofatap-tv-protocol-tests"
          "$RUNNER_TEMP/sofatap-tv-protocol-tests"
      - name: TV pairing and input lifecycle with injected transport
        run: bash ios/scripts/test-tv-controller.sh
      - name: Android TV QR pairing and acknowledged input lifecycle
        run: bash ios/scripts/test-android-tv.sh
      - name: TV auxiliary paging and control placement without device input
        run: bash ios/scripts/test-tv-auxiliary-controls.sh
      - name: TV TLS and WebSocket transport on loopback only
        run: bash ios/scripts/test-tv-transport.sh
      - name: Native iPhone draft composition with TV gesture profiles
        run: bash ios/scripts/test-draft-editor.sh
      - name: Preserve dictation results without microphone access
        run: bash ios/scripts/test-dictation-transcript.sh
      - name: Finish drag motion before releasing the mouse
        run: bash ios/scripts/test-drag-release.sh
      - name: Synchronize live text and selection without desktop input
        run: bash ios/scripts/test-live-text.sh
      - name: Preserve appended explicit drafts across focus and delivery changes
        run: bash ios/scripts/test-explicit-text.sh
      - name: Guard live phone gestures without connecting to a device
        run: python3 -m unittest discover -s tests/device-harness -p test_live_phone_gesture.py -v
      - name: Mac native-window protocol checks without launching a UI
        shell: bash
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 -target "$(uname -m)-apple-macosx15.0" \
            -o "$RUNNER_TEMP/sofatap-desktop-protocol-tests" desktop/macos/ReceiverProtocol.swift \
            desktop/macos/tests/ReceiverProtocolTests.swift
          "$RUNNER_TEMP/sofatap-desktop-protocol-tests"
      - name: Peer relay identity survives LAN address removal
        run: bash scripts/macos/test-peer-lifecycle.sh
      - name: Pinned TLS peer bridge integration without OS input
        run: SOFATAP_DOTNET="$(command -v dotnet)" python3 tests/peer-tls-bridge.py
      - name: Mac updater policy without network or installation
        shell: bash
        run: |
          xcrun swiftc -parse-as-library -swift-version 6 desktop/macos/ReceiverUpdatePolicy.swift \
            desktop/macos/tests/ReceiverUpdatePolicyTests.swift -o "$RUNNER_TEMP/sofatap-update-tests"
          "$RUNNER_TEMP/sofatap-update-tests"
          python3 -m unittest discover -s scripts/macos -p 'test_updates.py' -v
      - name: Mac independent pipe readers with quiet and busy stderr
        shell: bash
        run: |
          xcrun swiftc -parse-as-library -swift-version 6 -target "$(uname -m)-apple-macosx15.0" \
            -o "$RUNNER_TEMP/sofatap-desktop-pipe-tests" desktop/macos/ReceiverProtocol.swift \
            desktop/macos/ReceiverPipeReader.swift desktop/macos/tests/ReceiverPipeTests.swift
          "$RUNNER_TEMP/sofatap-desktop-pipe-tests"
      - name: Render Mac receiver design fixtures without a window or backend
        shell: bash
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 -D SOFATAP_UI_FIXTURE \
            -target "$(uname -m)-apple-macosx15.0" desktop/macos/*.swift \
            desktop/macos/tests/ReceiverAppearanceFixtures.swift -o "$RUNNER_TEMP/sofatap-appearance-fixtures"
          "$RUNNER_TEMP/sofatap-appearance-fixtures" artifacts/mint-calm
      - name: Save synthetic Mac UI fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mint-calm-macos
          path: artifacts/mint-calm/macos-*.png
          if-no-files-found: error
      - name: Windows native-window protocol and owned-process checks without launching a UI
        run: dotnet run --project desktop/windows/tests/ProtocolChecks.csproj -c Release
      - name: Compile unprovisioned iPhone app without installation
        run: bash ios/scripts/build-manual.sh device
      - name: Build Mac distributions and verify signatures
        run: |
          bash scripts/build-macos.sh arm64
          bash scripts/build-macos.sh x64
          python3 scripts/macos/test-sparkle-discovery.py
      - name: Windows packaging provenance and license checks
        run: python3 tests/windows_packaging.py
      - name: Build Windows distribution and include licenses
        run: bash scripts/build-windows.sh

  windows-host:
    name: Windows · host checks and self-contained build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Host checks with fake input
        run: dotnet run --project tests/host/SofaTap.Host.Tests.csproj -c Release
      - name: Recording harness checks with Windows file sharing
        run: dotnet run --project tests/device-harness/SofaTap.DeviceHarness.csproj -c Release -- --self-test
      - name: Windows Schannel TLS and authenticated recording transport
        run: dotnet run --project tests/device-harness/SofaTap.DeviceHarness.csproj -c Release -- --transport-check
      - name: Windows login broker state and credential lifetime checks
        run: dotnet run --project desktop/windows-login/Tests/Sofatap.Login.Tests.csproj -c Release
      - name: Compile optional Windows login service without installing it
        run: dotnet publish desktop/windows-login/Service/Sofatap.Login.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/windows-login/Service
      - name: Compile optional native Credential Provider without registering it
        run: |
          cmake -S desktop/windows-login/Provider -B artifacts/windows-login/provider-build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/windows-login/provider-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir artifacts/windows-login/provider-build -C Release --output-on-failure
      - name: Compile self-contained Windows receiver without launching it
        run: dotnet publish host/SofaTap.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/windows-ci
      - name: Compile bounded secure-desktop diagnostic and run no-input policy checks
        # Never install its service or run its input worker in CI.
        run: |
          $probeTokens = $null
          $probeParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/desktop/windows-secure-input-probe/Probe.ps1", [ref]$probeTokens, [ref]$probeParseErrors) | Out-Null
          if ($probeParseErrors.Count -ne 0) { $probeParseErrors | Format-List; exit 1 }
          cmake -S desktop/windows-secure-input-probe -B artifacts/windows-secure-input-probe -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/windows-secure-input-probe --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir artifacts/windows-secure-input-probe -C Release --output-on-failure
      - name: Windows native-window parser checks without launching a UI
        run: dotnet run --project desktop/windows/tests/ProtocolChecks.csproj -c Release
      - name: Compile self-contained WinForms frontend without launching it
        run: dotnet publish desktop/windows/SofaTap.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o artifacts/windows-ui-ci
      - name: Verify real updater installation and rollback with inert backends
        timeout-minutes: 8
        run: ./desktop/windows/tests/test-update-lifecycle.ps1
      - name: Render synthetic WinForms fixtures without a receiver backend
        run: dotnet run --project desktop/windows/preview/MintCalmPreview.csproj -c Release -- artifacts/mint-calm
      - name: Save synthetic Windows UI fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mint-calm-windows
          path: artifacts/mint-calm/windows-*.png
          if-no-files-found: error

  linux-native-protocol:
    name: Linux · native GTK, X11 input and isolated portal protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install isolated graphical test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core libatk-bridge2.0-0 xvfb xauth dbus libx11-6 libxtst6 libxdo3 fonts-noto-cjk
      - name: Host checks and worker failure lifecycle
        run: dotnet run --project tests/host/SofaTap.Host.Tests.csproj -c Release
      - name: Linux worker and native window checks without input
        run: |
          /usr/bin/python3 -B -W error::ResourceWarning desktop/linux/check_protocol.py
          /usr/bin/python3 -B -W error::ResourceWarning desktop/linux/check_autostart.py
          /usr/bin/python3 -B -W error::ResourceWarning desktop/linux/check_updates.py
          /usr/bin/python3 -B desktop/linux/check_input.py
          /usr/bin/python3 -B desktop/linux/check_wayland_input.py
          /usr/bin/python3 -B tests/text_focus_linux.py
      - name: Wayland portal wire protocol on a private mock D-Bus service
        run: /usr/bin/python3 -B desktop/linux/check_portal_dbus.py
      - name: Real X11 events on a private Xvfb server
        run: /usr/bin/python3 -B desktop/linux/check_x11_integration.py
      - name: Focused text metadata on private AT-SPI and Xvfb
        run: /usr/bin/python3 -B desktop/linux/check_text_focus_integration.py
      - name: Build Linux distributions and verify included licenses
        run: |
          SOFATAP_DOTNET="$(command -v dotnet)" bash scripts/build-linux.sh x64
          SOFATAP_DOTNET="$(command -v dotnet)" bash scripts/build-linux.sh arm64
      - name: Native GTK window rendering and child lifetime on private Xvfb
        run: SOFATAP_TEST_BACKEND="$PWD/artifacts/SofaTap-Linux-x64/lib/SofaTapHost" /usr/bin/python3 -B desktop/linux/check_gtk_integration.py
      - name: Render synthetic GTK fixtures on a private Xvfb display
        run: /usr/bin/python3 -B desktop/linux/preview_mint_calm.py --output artifacts/mint-calm
      - name: Save synthetic Linux UI fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mint-calm-linux
          path: artifacts/mint-calm/linux-*.png
          if-no-files-found: error

  android-controller:
    name: Android phone · controller, protocol and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select JDK 17 and verify the runner Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Compile phone APK and device tests; run JVM checks and lint
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :controller:assembleDebug :controller:assembleDebugAndroidTest :controller:testDebugUnitTest :controller:lintDebug
      - name: Save development APK and software reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-phone-controller-development
          path: |
            android/controller/build/outputs/apk/debug/controller-debug.apk
            android/controller/build/reports/tests/testDebugUnitTest/
            android/controller/build/reports/lint-results-debug.html
          if-no-files-found: error

  android-tv:
    name: Android TV · native receiver, protocol and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select JDK 17 and verify the runner Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Compile APK and device tests; run JVM checks and lint
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :receiver:assembleDebug :receiver:assembleDebugAndroidTest :receiver:testDebugUnitTest :receiver:lintDebug
      - name: Save development APK and software reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-tv-development-probe
          path: |
            android/receiver/build/outputs/apk/debug/receiver-debug.apk
            android/receiver/build/reports/tests/testDebugUnitTest/
            android/receiver/build/reports/lint-results-debug.html
          if-no-files-found: error
